plugins {
    id 'java-library'
}

apply plugin: 'antlr'

dependencies {
  implementation 'org.ow2.asm:asm:9.11.1'
  implementation 'org.ow2.asm:asm-tree:9.11.1'
  implementation 'org.ow2.asm:asm-util:9.11.1'
  implementation(group: 'org.antlr', name: 'antlr-runtime', version:'3.5.2') {
        exclude(module: 'stringtemplate')
  }
  api project(':d2j-base-cmd')
  antlr "org.antlr:antlr:3.5.2"
}

sourceSets.main.antlr.srcDirs = ['src/main/antlr3']
