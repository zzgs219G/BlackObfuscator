plugins {
    id 'java-library'
}

apply plugin: 'antlr'

dependencies {
  implementation 'org.antlr:antlr4-runtime:4.13.2'
  api project(':dex-reader')
  antlr 'org.antlr:antlr4:4.13.2'
  api project(':d2j-base-cmd')
  api project(':dex-writer')
  testImplementation 'org.smali:baksmali:2.5.2'
}

tasks.named('generateGrammarSource') {
    arguments += ['-no-listener', '-visitor', '-package', 'com.googlecode.d2j.smali.antlr4']
}

sourceSets {
    main {
        antlr.srcDirs = ['src/main/antlr4']
    }
}
